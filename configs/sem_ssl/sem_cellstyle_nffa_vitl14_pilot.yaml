  patch_size: 14
  in_chans: 3
  num_register_tokens: 0
  block_chunks: 0
  ffn_layer: mlp
  drop_path_rate: 0.1
train:
  batch_size_per_gpu: 32
  num_workers: 16
  centering: centering
loader:
  persistent_workers: true
  prefetch_factor: 2
  pin_memory: true
  non_blocking: true
  decoded_cache: null
crops:
  global_crops_size: 518
  local_crops_size: 224
  global_crops_scale:
  - 0.5
  - 1.0
  local_crops_scale:
  - 0.15
  - 0.5
  local_crops_number: 8
dino:
