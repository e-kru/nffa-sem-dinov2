  - 1
  - 5
  - 10
  - 25
  - 50
  - 100
  warmup_passes: 5
  freeze_last_layer_passes: 1
  teacher_temperature_warmup_passes: 20
runtime:
  physical_batch: null
  effective_batch: 128
