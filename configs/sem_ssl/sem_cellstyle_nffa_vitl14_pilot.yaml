  - 0.5
optim:
  scaling_rule: absolute
  backbone_lr: 1.0e-05
  backbone_min_lr: 1.0e-07
  head_lr: 0.0001
  head_min_lr: 1.0e-06
  layerwise_decay: 0.9
  patch_embed_lr_mult: 0.2
  weight_decay: 0.04
  weight_decay_end: 0.2
  adamw_beta1: 0.9
  adamw_beta2: 0.999
  clip_grad: 3.0
teacher:
  momentum_teacher: 0.999
  final_momentum_teacher: 1.0
  warmup_teacher_temp: 0.04
  teacher_temp: 0.07
checkpointing:
  recovery_every_optimizer_updates: 1000
  keep_recent_recovery_snapshots: 2
evaluation:
  head_profile: residual_v1
  quick_validation_passes:
