  target_train_originals: 12801
  feasible_first_corpus_originals: 12801
  receipt: null
  selection_protocol: split_A_train_v1
initialization:
  checkpoint: outputs/pretrained/dinov2_vitl14_pretrain.pth
  sha256: d5383ea8f4877b2472eb973e0fd72d557c7da5d3611bd527ceeb1d7162cbf428
budget:
  full_original_presentation_passes: 100
  initial_run_until_passes: 10
