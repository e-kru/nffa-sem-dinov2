# Merge over the pinned Meta ssl_default_config.yaml. Bounded pilot only.
student:
  arch: vit_small
  patch_size: 14
  drop_path_rate: 0.3
  block_chunks: 0
  ffn_layer: mlp
train:
  batch_size_per_gpu: 8
  num_workers: 8
  centering: centering
  OFFICIAL_EPOCH_LENGTH: 100
  seed: 42
crops:
  global_crops_size: 224
  local_crops_size: 98
  local_crops_number: 8
optim:
  epochs: 20
  base_lr: 0.0002
  warmup_epochs: 1
  freeze_last_layer_epochs: 1
teacher:
  warmup_teacher_temp_epochs: 1
ibot:
  separate_head: false
